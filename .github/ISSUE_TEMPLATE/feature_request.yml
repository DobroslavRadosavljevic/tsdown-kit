name: Feature request
description: Ask for a new feature or a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Tell us what you tried to do, and what stopped you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you suggest?
      description: An API sketch or an example of the use is enough.
    validations:
      required: true
