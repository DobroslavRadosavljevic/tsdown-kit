# Comments on each pull request: does it have a changeset, and which version bump will it cause?
# It does not block the merge. Based on https://changesets.dev/guide/automating#non-blocking,
# with `pull_request` instead of `pull_request_target`, so code from forks never gets a write token.
name: Changeset status

on:
  # Off in the kit repo: only a manual run starts it. `bun run setup` removes the `#off ` prefixes.
  workflow_dispatch:
  #off pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-status:
    name: Read changesets
    # Fork pull requests get a read-only token and cannot comment. The release PR never has changesets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      comment-body: ${{ steps.pr-status.outputs.comment-body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pr-status
        uses: changesets/action/pr-status@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  pr-comment:
    name: Comment on the pull request
    needs: pr-status
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: changesets/action/pr-comment@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          body: ${{ needs.pr-status.outputs.comment-body }}
