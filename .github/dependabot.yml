version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # Off in the kit repo. `bun run setup` removes this line.
    groups:
      dev-dependencies:
        dependency-type: development
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # Off in the kit repo. `bun run setup` removes this line.
    groups:
      actions:
        patterns: ['*']
    cooldown:
      default-days: 7
